# 操作がないまま、この分数がたつと離席とみなします。
# 離席になると、最後に操作した時点までさかのぼってプレイ時間から除きます。
afk-minutes: 10

# プレイヤーデータを保存する間隔(分)。ランキングもこの間隔で作り直します。
save-interval-minutes: 5

# 昇格の段階。上から順に判定します。
# 今のグループ(LuckPerms のプライマリグループ)が from の人のプレイ時間(離席は除く)が
# hours 時間に達すると、to のグループを追加します(from のグループは外しません)。
promotions:
  - from: default
    to: moderator
    hours: 5
